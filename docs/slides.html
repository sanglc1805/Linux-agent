<h2 id="the-problem">The problem</h2>
<div class="two">
<div>
<h3 id="a-chat-model-cannot-operate-a-machine">A chat model cannot operate a machine</h3>
<ul>
<li>It can explain <code>systemctl</code> but cannot read the real state.</li>
<li>It can hallucinate a unit, path, parameter or value.</li>
<li>It cannot back up, validate or roll back.</li>
<li>It leaves no evidence of what it did.</li>
</ul>
</div>
<div class="card bad">
<h3 id="a-shell-tool-is-too-much">A shell tool is too much</h3>
<ul>
<li>One injection = full user access.</li>
<li>The model can chain arbitrary commands.</li>
<li>Auditing free-form shell is hard.</li>
<li>&quot;Just be careful&quot; is not a control.</li>
</ul>
</div>
</div>
<p><strong>Goal:</strong> a typed, allow-listed, dry-run-first tool boundary between the model and Linux.</p>
</section>

<h2 id="background-the-agent-loop">Background: the agent loop</h2>
<div class="two">
<div>
<h3 id="plan-%E2%86%92-act-%E2%86%92-observe">Plan → Act → Observe</h3>
<ol>
<li>The LLM chooses a tool and JSON arguments.</li>
<li>The client executes the tool.</li>
<li>The result is appended to the conversation.</li>
<li>The model continues or answers.</li>
</ol>
<p>The model <strong>never executes anything</strong>. The boundary is the client/server.</p>
</div>
<div>
<p><img src="diagrams/agent-loop.svg" alt="" style="width:520px;" /></p>
</div>
</div>
<p><span class="small">Bounded to 8 steps. A denied approval becomes a tool error, not a retry.</span></p>
</section>

<h2 id="background-mcp">Background: MCP</h2>
<div class="two">
<div>
<h3 id="model-context-protocol">Model Context Protocol</h3>
<ul>
<li>Open JSON-RPC 2.0 protocol.</li>
<li><strong>Tools:</strong> callable, typed, may have side effects.</li>
<li><strong>Resources:</strong> readable data by URI.</li>
<li><strong>Prompts:</strong> reusable task templates.</li>
<li>Transports: <strong>stdio</strong> and <strong>Streamable HTTP</strong>.</li>
<li>Annotations: <code>readOnlyHint</code>, <code>destructiveHint</code>.</li>
</ul>
</div>
<div class="card">
<h3 id="why-it-fits">Why it fits</h3>
<table>
<thead>
<tr>
<th>Ad-hoc shell</th>
<th>MCP</th>
</tr>
</thead>
<tbody>
<tr>
<td>Not discoverable</td>
<td><code>tools/list</code></td>
</tr>
<tr>
<td>Unvalidated text</td>
<td>JSON Schema</td>
</tr>
<tr>
<td>One-off script</td>
<td>Reusable server</td>
</tr>
<tr>
<td>Hard to audit</td>
<td>Discrete calls</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>

<h2 id="23-tools-three-risk-classes">23 tools, three risk classes</h2>
<div class="three">
<div class="card good">
<h3 id="read-only-20">Read-only (20)</h3>
<p><code>system_overview</code>, <code>service_status</code>, <code>service_logs</code>, <code>failed_units</code>, <code>disk_usage</code>,<br />
<code>process_top</code>, <code>network_overview</code>, <code>listening_ports</code>, <code>http_probe</code>, <code>package_info</code>,<br />
<code>read_config</code>, <code>container_list</code>, <code>container_logs</code>, <code>nginx_info</code>, <code>nginx_*</code> reads.</p>
</div>
<div class="card warn">
<h3 id="controlled-writes-3">Controlled writes (3)</h3>
<p><code>service_action</code> <span class="pill write">dry-run</span></p>
<p><code>nginx_set_parameter</code> <span class="pill write">dry-run</span></p>
<p><code>nginx_rollback</code> <span class="pill write">dry-run</span></p>
</div>
<div class="card">
<h3 id="mcp-extras">MCP extras</h3>
<p><strong>Resources:</strong> host summary, policy, nginx values, <code>logs/{unit}</code>.</p>
<p><strong>Prompts:</strong> triage, safe nginx change, health report.</p>
</div>
</div>

<h2 id="policy-is-data-not-code">Policy is data, not code</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-toml"><span class="hljs-section">[security]</span>
<span class="hljs-attr">allow_write</span> = <span class="hljs-literal">false</span>
<span class="hljs-attr">audit_log</span> = <span class="hljs-string">&quot;logs/audit.jsonl&quot;</span>
<span class="hljs-attr">min_write_interval_seconds</span> = <span class="hljs-number">1.0</span>

<span class="hljs-section">[units]</span>
<span class="hljs-attr">allowed</span> = [<span class="hljs-string">&quot;nginx&quot;</span>]
<span class="hljs-attr">actions</span> = [<span class="hljs-string">&quot;start&quot;</span>, <span class="hljs-string">&quot;stop&quot;</span>, <span class="hljs-string">&quot;restart&quot;</span>, <span class="hljs-string">&quot;reload&quot;</span>]

<span class="hljs-section">[nginx.parameters.client_max_body_size]</span>
<span class="hljs-attr">context</span> = <span class="hljs-string">&quot;http&quot;</span>
<span class="hljs-attr">pattern</span> = <span class="hljs-string">&quot;^(0|[1-9][0-9]{0,4}[kKmMgG]?)$&quot;</span>
</code></pre>
<div class="two">
<div class="card">
<p><strong>Two layers must agree</strong></p>
<ul>
<li><code>policy.toml</code> for the server.</li>
<li><code>/etc/linux-agent/allowed-units</code> for the root helper.</li>
</ul>
</div>

<p><strong>Environment overrides</strong></p>
<p><code>LINUX_AGENT_ALLOW_WRITE=1</code>, <code>LINUX_AGENT_HELPER_DIR</code>, <code>GROQ_MODEL</code>, …</p>
</div>

<h2 id="the-required-shell-script-nginx_paramsh">The required shell script: <code>nginx_param.sh</code></h2>
<div class="two">
<div>
<h3 id="what-it-changes">What it changes</h3>
<ul>
<li><code>worker_processes</code> (main)</li>
<li><code>worker_connections</code> (events)</li>
<li><code>client_max_body_size</code> (http)</li>
<li><code>keepalive_timeout</code>, <code>client_body_timeout</code>, <code>send_timeout</code></li>
<li><code>gzip</code>, <code>server_tokens</code></li>
</ul>
<p><strong>8 parameters</strong>, one allow-list.</p>
</div>
<div>
<h3 id="how-it-changes-it">How it changes it</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">list | get | set | test | status
list-backups | diff-backup | rollback
</code></pre>
<ul>
<li>HTTP parameters → managed drop-in.</li>
<li>main/events → edit <code>nginx.conf</code>.</li>
<li>value validated twice.</li>
<li>atomic write, <code>flock</code>.</li>
<li><code>nginx -t</code>, optional reload.</li>
</ul>
</div>
</div>
</section>

<h2 id="change-safety-backup-test-rollback">Change safety: backup, test, rollback</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">set(param, value) →
  validate param + value
  render candidate (drop-in or nginx.conf)
  if dry-run: show diff, stop
  lock → timestamped backup → atomic write
  nginx -t
     fail → restore backup, remove new file, error
  reload (optional)
     fail → restore backup, restore old config, error
  success + backup id + diff
</code></pre>
<div class="card warn">
<p><strong>The absent-file marker</strong> makes a failed first change correct: rollback removes the<br />
new drop-in instead of leaving a half-applied config.</p>
</div>
</section>

<h2 id="agent-implementation">Agent implementation</h2>
<div class="two">
<div>
<h3 id="groq--function-calling">Groq + function calling</h3>
<ul>
<li>MCP tools → OpenAI schemas.</li>
<li><code>tool_choice=&quot;auto&quot;</code>.</li>
<li>Retries for rate limit, connection, timeout.</li>
<li>Blocking SDK call runs in a worker thread.</li>
<li>Tool results truncated for the model; full result in the audit.</li>
</ul>
</div>
<div>
<h3 id="cli">CLI</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">.venv/bin/python agent.py
.venv/bin/python agent.py --list-tools
.venv/bin/python agent.py --prompt <span class="hljs-string">&quot;...&quot;</span>
.venv/bin/python agent.py --transport streamable-http \
  --url http://127.0.0.1:8000/mcp
</code></pre>
<p>Interactive: <code>/tools</code>, <code>/reset</code>, <code>/audit</code>, <code>/policy</code>, <code>/quit</code>.</p>
</div>
</div>

<h2 id="human-approval">Human approval</h2>
<div class="two">
<div>
<h3 id="when-it-asks">When it asks</h3>
<ul>
<li>Read-only tool → <strong>never</strong>.</li>
<li>Write tool + <code>dry_run=true</code> → <strong>never</strong>.</li>
<li>Write tool + <code>dry_run=false</code> → <strong>y / N / always</strong>.</li>
<li>Unknown mutating tool → <strong>always ask</strong>.</li>
</ul>
</div>
<div class="card">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">[!] Approval required
    tool: nginx_set_parameter
    args: {&quot;parameter&quot;: &quot;client_max_body_size&quot;,
           &quot;value&quot;: &quot;20m&quot;, &quot;dry_run&quot;: false}
    Approve? [y]es / [N]o / [a]lways
</code></pre>
<p><span class="small"><code>always</code> is per tool, per session. It is not persisted.</span></p>
</div>
</div>

<div class="three">

<li>redaction is heuristic</li>
<li>audit is local</li>
<li>syntax ≠ intent</li>

<li>correctness of the chosen value</li>
</ul>
</div>

<h2 id="limitations">Limitations</h2>
<div class="two">
<div>
<h3 id="technical">Technical</h3>
<ul>
<li>nginx is the only configurable service.</li>
<li><code>nginx -t</code> validates syntax, not business intent.</li>
<li>No built-in HTTP authentication.</li>
<li>Audit is local and append-only, not tamper-proof.</li>
<li>Redaction patterns are heuristic.</li>
<li>One file transaction at a time.</li>
</ul>
</div>
<div>
<h3 id="operational">Operational</h3>
<ul>
<li>Human approval is required for every apply.</li>
<li>Model behaviour varies between runs.</li>
<li>No benchmark for task success yet.</li>
<li>A root helper bug would run as root.</li>
<li>The project is a teaching platform, not a control plane.</li>
</ul>
</div>
</div>
</section>

<h2 id="future-work">Future work</h2>
<ol>
<li><strong>Auth:</strong> OAuth 2.1 / mTLS for HTTP; per-user RBAC.</li>
<li><strong>Policy engine:</strong> OPA/Rego, change windows, one-time approval tokens.</li>
<li><strong>More services:</strong> PostgreSQL, Redis, SSH, cron, Compose — each with a validator.</li>
<li><strong>Sandboxing:</strong> <code>systemd-run</code> with <code>DynamicUser</code>, <code>ProtectSystem</code>, <code>PrivateTmp</code>.</li>
<li><strong>Local models:</strong> Ollama/vLLM for data-sensitive hosts.</li>
<li><strong>Benchmark:</strong> 30–50 Linux tasks with safety outcomes.</li>
<li><strong>Web UI:</strong> diff view, approval buttons, audit timeline.</li>
<li><strong>Remote audit:</strong> hash chaining + remote syslog.</li>
</ol>

<h2 id="conclusion">Conclusion</h2>
<div class="two">
<div>
<h3 id="what-we-built">What we built</h3>
<ul>
<li>A real MCP server with <strong>23 tools</strong>, <strong>4 resources</strong>, <strong>3 prompts</strong>.</li>
<li>A Groq agent with a bounded loop and human approval.</li>
<li>A safe nginx helper: validate, backup, test, rollback.</li>
<li>A root-owned install path with a validated sudoers rule.</li>
<li>29 tests, a lab demo and real-host evidence.</li>
</ul>
</div>
<div class="card good">
<h3 id="the-lesson">The lesson</h3>
<p>The hard part of agentic Linux is <strong>not the LLM call</strong>. It is the boundary:</p>
<ul>
<li>what may the model ask for?</li>
<li>who validates it?</li>
<li>how is it reversed?</li>
<li>where is it recorded?</li>
</ul>
<p>MCP gives a clean protocol for that boundary.</p>
</div>
</div>
