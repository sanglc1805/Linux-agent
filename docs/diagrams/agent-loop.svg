<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 19px "DejaVu Sans", sans-serif; fill: #0f172a; }
      .h { font: 700 14px "DejaVu Sans", sans-serif; fill: #0f172a; }
      .t { font: 11.5px "DejaVu Sans", sans-serif; fill: #334155; }
      .small { font: 10.5px "DejaVu Sans", sans-serif; fill: #475569; }
      .box { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.4; rx: 10; }
      .amber { fill: #fef3c7; stroke: #b45309; stroke-width: 1.4; rx: 10; }
      .green { fill: #dcfce7; stroke: #15803d; stroke-width: 1.4; rx: 10; }
      .red { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.4; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" class="title">Agent Plan – Act – Observe loop</text>

  <rect x="330" y="60" width="200" height="70" class="box"/>
  <text x="430" y="88" text-anchor="middle" class="h">User intent</text>
  <text x="430" y="108" text-anchor="middle" class="small">natural language</text>
  <line x1="430" y1="130" x2="430" y2="160" class="arrow"/>

  <rect x="310" y="165" width="240" height="70" class="box"/>
  <text x="430" y="193" text-anchor="middle" class="h">1. Plan</text>
  <text x="430" y="213" text-anchor="middle" class="small">LLM chooses a tool + arguments</text>
  <line x1="430" y1="235" x2="430" y2="265" class="arrow"/>

  <rect x="310" y="270" width="240" height="70" class="amber"/>
  <text x="430" y="298" text-anchor="middle" class="h">2. Approve</text>
  <text x="430" y="318" text-anchor="middle" class="small">only for non-dry-run writes</text>
  <line x1="430" y1="340" x2="430" y2="370" class="arrow"/>

  <rect x="310" y="375" width="240" height="70" class="green"/>
  <text x="430" y="403" text-anchor="middle" class="h">3. Act + observe</text>
  <text x="430" y="423" text-anchor="middle" class="small">MCP call, read result</text>

  <line x1="550" y1="410" x2="680" y2="410" class="arrow"/>
  <rect x="685" y="375" width="150" height="70" class="red"/>
  <text x="760" y="403" text-anchor="middle" class="h">4. Decide</text>
  <text x="760" y="423" text-anchor="middle" class="small">continue or answer</text>
  <text x="760" y="440" text-anchor="middle" class="small">max 8 steps</text>

  <path d="M685,390 C600,330 560,300 550,285" class="arrow"/>
  <text x="600" y="330" class="small">more evidence needed</text>
  <path d="M685,435 C650,470 560,470 550,435" class="arrow"/>
  <text x="600" y="478" class="small">done: final answer</text>
  <line x1="550" y1="435" x2="555" y2="435" class="arrow"/>

  <text x="430" y="490" text-anchor="middle" class="small">Denied approvals become a tool error; the model cannot retry without the user.</text>
</svg>
